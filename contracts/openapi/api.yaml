# ============================================================
# CrimeLensAI — OpenAPI Specification: API Gateway Service
# ============================================================
openapi: "3.1.0"
info:
  title: CrimeLensAI API Gateway
  version: "0.1.0"
  description: |
    Public Case API and orchestration layer. The only service the
    frontend communicates with directly.

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service and dependency health

  /api/v1/cases:
    post:
      summary: Create a new case
      operationId: createCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseCreate"
      responses:
        "201":
          description: Case created
    get:
      summary: List cases with pagination
      operationId: listCases
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated case list

  /api/v1/cases/{case_id}:
    get:
      summary: Get case details with entities and linkages
      operationId: getCase
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Case with entities and linkages
    put:
      summary: Update case
      operationId: updateCase
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Case updated
    delete:
      summary: Soft-delete case
      operationId: deleteCase
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Case archived

  /api/v1/search:
    get:
      summary: Search cases and entities
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: entity_type
          in: query
          schema:
            type: string
            enum: [PERSON, PHONE, VEHICLE, UPI_ID, LOCATION, ORG]
      responses:
        "200":
          description: Search results

  /api/v1/ingest:
    post:
      summary: Bulk data ingestion
      operationId: ingestData
      responses:
        "200":
          description: Ingestion queued

  /api/v1/dashboard/stats:
    get:
      summary: Dashboard statistics
      operationId: getDashboardStats
      responses:
        "200":
          description: Aggregated stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /api/v1/entities/{entity_id}/confirm:
    post:
      summary: Confirm an extracted entity
      operationId: confirmEntity
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Entity confirmed

  /api/v1/entities/{entity_id}/reject:
    post:
      summary: Reject an extracted entity
      operationId: rejectEntity
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Entity rejected

components:
  schemas:
    CaseCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        fir_text:
          type: string
        call_records:
          type: string
        financial_logs:
          type: string
        location_data:
          type: string
        district:
          type: string
        station:
          type: string
        filing_date:
          type: string
          format: date-time

    DashboardStats:
      type: object
      properties:
        total_cases:
          type: integer
        total_entities:
          type: integer
        cross_case_links:
          type: integer
        pending_reviews:
          type: integer
        cases_by_status:
          type: object
          additionalProperties:
            type: integer
