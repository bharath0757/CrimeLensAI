# ============================================================
# CrimeLensAI — OpenAPI Specification: API Gateway Service
# ============================================================
openapi: "3.1.0"
info:
  title: CrimeLensAI API Gateway
  version: "0.1.0"
  description: |
    Public Case API and orchestration layer. The only service the
    frontend communicates with directly.

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service and dependency health

  /api/v1/cases:
    post:
      summary: Create a new case
      operationId: createCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseCreate"
      responses:
        "201":
          description: Case created
    get:
      summary: List cases with pagination
      operationId: listCases
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated case list

  /api/v1/cases/{case_id}:
    get:
      summary: Get case details with entities and linkages
      operationId: getCase
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Case with entities and linkages
    put:
      summary: Update case
      operationId: updateCase
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Case updated
    delete:
      summary: Soft-delete case
      operationId: deleteCase
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Case archived

  /api/v1/cases/{case_id}/insights:
    get:
      summary: Get case-scoped network insights
      operationId: getCaseInsights
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Explainable investigative leads and centrality-ranked people
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseInsightsResponse"
        "403":
          description: The current user cannot access the case
        "503":
          description: Optional graph analytics are unavailable

  /api/v1/search:
    get:
      summary: Search cases and entities
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: entity_type
          in: query
          schema:
            type: string
            enum: [PERSON, PHONE, VEHICLE, UPI_ID, LOCATION, ORG]
      responses:
        "200":
          description: Search results

  /api/v1/ingest:
    post:
      summary: Bulk data ingestion
      operationId: ingestData
      responses:
        "200":
          description: Ingestion queued

  /api/v1/dashboard/stats:
    get:
      summary: Dashboard statistics
      operationId: getDashboardStats
      responses:
        "200":
          description: Aggregated stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /api/v1/entities/{entity_id}/confirm:
    post:
      summary: Confirm an extracted entity
      operationId: confirmEntity
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Entity confirmed

  /api/v1/entities/{entity_id}/reject:
    post:
      summary: Reject an extracted entity
      operationId: rejectEntity
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Entity rejected

components:
  schemas:
    CaseCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        fir_text:
          type: string
        call_records:
          type: string
        financial_logs:
          type: string
        location_data:
          type: string
        district:
          type: string
        station:
          type: string
        filing_date:
          type: string
          format: date-time

    CentralityMetrics:
      type: object
      required: [degree, betweenness, pagerank]
      properties:
        degree:
          type: number
          minimum: 0
        betweenness:
          type: number
          minimum: 0
        pagerank:
          type: number
          minimum: 0

    CaseInsightPattern:
      type: object
      required: [pattern_type, case_ids, confidence, supporting_entity_ids, explanation, disposition]
      properties:
        pattern_type:
          type: string
        case_ids:
          type: array
          items: {type: string}
        confidence:
          type: number
          minimum: 0
          maximum: 1
        supporting_entity_ids:
          type: array
          items: {type: string}
        explanation:
          type: string
        disposition:
          type: string
          enum: [INVESTIGATIVE_LEAD_NOT_FACT]

    InfluentialPerson:
      type: object
      required: [entity_id, name, entity_type, centrality, explanation, is_masked]
      properties:
        entity_id: {type: string}
        name: {type: string}
        entity_type: {type: string}
        centrality:
          $ref: "#/components/schemas/CentralityMetrics"
        explanation: {type: string}
        is_masked: {type: boolean}

    LinkCandidate:
      type: object
      required: [source_entity_id, target_entity_id, confidence, common_neighbor_ids, explanation, disposition]
      properties:
        source_entity_id: {type: string}
        target_entity_id: {type: string}
        source_name: {type: [string, "null"]}
        target_name: {type: [string, "null"]}
        confidence:
          type: number
          minimum: 0
          maximum: 1
        common_neighbor_ids:
          type: array
          items: {type: string}
        explanation: {type: string}
        method: {type: [string, "null"]}
        disposition:
          type: string
          enum: [INVESTIGATIVE_LEAD_NOT_FACT]

    CaseInsightsResponse:
      type: object
      required: [case_id, influential_people, patterns, link_candidates, status, warnings, disclaimer]
      properties:
        case_id: {type: string}
        influential_people:
          type: array
          items:
            $ref: "#/components/schemas/InfluentialPerson"
        patterns:
          type: array
          items:
            $ref: "#/components/schemas/CaseInsightPattern"
        link_candidates:
          type: array
          items:
            $ref: "#/components/schemas/LinkCandidate"
        status: {type: string}
        warnings:
          type: array
          items: {type: string}
        disclaimer: {type: string}

    DashboardStats:
      type: object
      properties:
        total_cases:
          type: integer
        total_entities:
          type: integer
        cross_case_links:
          type: integer
        pending_reviews:
          type: integer
        cases_by_status:
          type: object
          additionalProperties:
            type: integer
