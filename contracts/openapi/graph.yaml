# ============================================================
# CrimeLensAI — OpenAPI Specification: Graph Service
# ============================================================
openapi: "3.1.0"
info:
  title: CrimeLensAI Graph Service
  version: "0.1.0"
  description: Neo4j-backed cross-case linkage and network analysis.

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy

  /api/v1/entities:
    post:
      summary: Create or update entity node
      operationId: upsertEntity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractedEntity"
      responses:
        "200":
          description: Entity upserted

  /api/v1/relationships:
    post:
      summary: Create relationship between entities
      operationId: createRelationship
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphRelationship"
      responses:
        "200":
          description: Relationship created

  /api/v1/linkage/{case_id}:
    get:
      summary: Get cross-case linkage for a case
      operationId: getCrossCaseLinkage
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Linked cases

  /api/v1/patterns/{case_id}:
    get:
      summary: Detect explainable cross-case patterns
      operationId: detectCasePatterns
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Repeated identifiers, multi-signal convergence, and bridge entities

  /api/v1/link-predictions:
    get:
      summary: Rank candidate missing links for human review
      operationId: predictMissingLinks
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: min_score
          in: query
          schema:
            type: number
            default: 0.2
      responses:
        "200":
          description: Explainable candidate links labelled as investigative leads, not facts

  /api/v1/alerts:
    get:
      summary: List officer-facing cross-case connection alerts
      operationId: listLinkAlerts
      parameters:
        - name: case_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [NEW, ACKNOWLEDGED]
      responses:
        "200":
          description: Alert queue

  /api/v1/alerts/{alert_id}/acknowledge:
    post:
      summary: Acknowledge a link alert without deleting its history
      operationId: acknowledgeLinkAlert
      parameters:
        - name: alert_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated alert

  /api/v1/analyze/firs:
    post:
      summary: Analyze multiple raw FIRs and return an officer-ready report
      operationId: analyzeRawFirs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firs]
              properties:
                firs:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: "#/components/schemas/RawFirInput"
      responses:
        "200":
          description: Extraction results, alerts, linkages, patterns, and officer brief
        "503":
          description: Extraction service unavailable or returned an incomplete batch

  /api/v1/centrality/{entity_id}:
    get:
      summary: Get entity centrality metrics
      operationId: getEntityCentrality
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Centrality metrics

  /api/v1/communities:
    get:
      summary: Detect communities in entity graph
      operationId: detectCommunities
      responses:
        "200":
          description: Community clusters

  /api/v1/shortest-path:
    get:
      summary: Find shortest path between entities
      operationId: shortestPath
      parameters:
        - name: entity_a
          in: query
          required: true
          schema:
            type: string
        - name: entity_b
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shortest path

components:
  schemas:
    RawFirInput:
      type: object
      required: [case_id, raw_text]
      properties:
        case_id:
          type: string
        raw_text:
          type: string
        source_field:
          type: string
          default: fir_text
        district:
          type: string
        fir_number:
          type: string

    ExtractedEntity:
      type: object
      properties:
        id:
          type: string
        entity_type:
          type: string
          enum: [PERSON, PHONE, VEHICLE, UPI_ID, LOCATION, ORG]
        value:
          type: string
        canonical_value:
          type: string
        confidence:
          type: number
        case_id:
          type: string
        source_field:
          type: string
        start_offset:
          type: integer
        end_offset:
          type: integer

    GraphRelationship:
      type: object
      required: [source_entity_id, target_entity_id, relationship_type, source_case_id, confidence, why_linked]
      properties:
        source_entity_id:
          type: string
        target_entity_id:
          type: string
        relationship_type:
          type: string
        source_case_id:
          type: string
        confidence:
          type: number
        why_linked:
          type: string
