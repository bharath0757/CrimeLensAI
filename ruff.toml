target-version = "py311"
line-length = 120
extend-exclude = ["data", "frontend", "output", "tmp"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE", "LOG", "RET", "RUF", "SIM", "UP"]
ignore = [
  "B008",   # FastAPI dependency and parameter marker calls are intentional defaults.
  "EXE002", # Git executable-bit checks are unreliable on Windows worktrees.
]
