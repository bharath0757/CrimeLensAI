# Run with a configured .env. Use a distinct -p project name for isolated testing.
# Only the web server and API bind to the host, on loopback by default.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crimelens_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-crimelens}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: database/Dockerfile
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-crimelens_owner}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-crimelens}
      API_DATABASE_PASSWORD: ${API_DATABASE_PASSWORD:?Set API_DATABASE_PASSWORD}
      LEDGER_DATABASE_PASSWORD: ${LEDGER_DATABASE_PASSWORD:?Set LEDGER_DATABASE_PASSWORD}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD}
      SEED_SYNTHETIC: ${SEED_SYNTHETIC:-false}
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-false}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  extraction:
    build: ./services/entity-extraction-service
    environment:
      ENVIRONMENT: production
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:?Set SERVICE_AUTH_TOKEN}
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8001/health')); assert d['spacy_model_loaded']"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  graph:
    build: ./services/graph-service
    environment:
      ENVIRONMENT: production
      GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:?Set SERVICE_AUTH_TOKEN}
      EXTRACTION_SERVICE_URL: http://extraction:8001
    depends_on:
      neo4j: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  ledger:
    build: ./services/audit-ledger-service
    environment:
      ENVIRONMENT: production
      LEDGER_DATABASE_URL: postgresql+psycopg2://crimelens_ledger:${LEDGER_DATABASE_PASSWORD:?Set LEDGER_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-crimelens}
      LEDGER_AUTO_MIGRATE: "false"
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:?Set SERVICE_AUTH_TOKEN}
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ingestion:
    build: ./services/ingestion-service
    environment:
      ENVIRONMENT: production
      API_SERVICE_URL: http://api:8000
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:?Set SERVICE_AUTH_TOKEN}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./services/case-api
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATA_BACKEND: postgres
      DATABASE_URL: postgresql+psycopg2://crimelens_api:${API_DATABASE_PASSWORD:?Set API_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-crimelens}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:?Set SERVICE_AUTH_TOKEN}
      AI_SERVICE_URL: http://extraction:8001
      GRAPH_SERVICE_URL: http://graph:8002
      LEDGER_SERVICE_URL: http://ledger:8003
      INGESTION_SERVICE_URL: http://ingestion:8004
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-[]}
      UPLOAD_DIR: /data/uploads
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"]
    volumes: [uploads:/data/uploads]
    depends_on:
      migrate: {condition: service_completed_successfully}
      extraction: {condition: service_healthy}
      graph: {condition: service_healthy}
      ledger: {condition: service_healthy}
      ingestion: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-5173}:8080"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  uploads:
